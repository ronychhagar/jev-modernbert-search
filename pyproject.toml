[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-modernbert-search"
version = "0.1.0"
description = "ModernBERT retrieval with TypeSafe Jev reranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jevclient",
    "kagglehub",
    "numpy>=1.26",
    "neo4j>=5.20",
    "sentence-transformers>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jev-search = "jev_modernbert_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
